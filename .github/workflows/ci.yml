name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-indexer:
    name: Run indexer tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install all dependencies
        run: make setup

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run indexer tests
        working-directory: ./PoCEvolve
        run: PYTHONPATH=. python -m unittest discover -s src/indexer/tests -v
